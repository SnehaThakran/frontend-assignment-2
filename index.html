<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Weather Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: Arial;
    background: linear-gradient(135deg, #3545ad, #313c79);
    padding:18px 22px;
    display:flex;
    justify-content:center;
    transition:0.3s;
}

.container { max-width:1080px;
     width:100%;
    margin: auto;
padding: 4px; }

.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    padding: 2px 4px;
}

h1 { color:#47c4f5; }

.parent-card {
    display: flex;
    gap: 34px;
    align-items: flex-start;
    flex-direction: column;
 }

.card {
    background:#f1ecec;
    border-radius:13px;
    padding:18px;
    width:100%;
    transition:0.25s ease;
}
.card:hover {
    transform: translateY(-3px);
}

.card:nth-child(2) {
    background:#f8f3f3;
}

.input-group { display:flex; 
    gap:11px; 
    align-items: center;
    margin-top:4px;
}

input {
    flex:1; 
    padding:11px;
    border-radius:7px;
    border:2px solid #b4eaff;
}

button {
    padding:9px 14px;
    background:#F16D34;
    color:#fff;
    border:none;
    border-radius:7px;
    cursor:pointer;
    transition: 0.3;
}

.weather-item {
    display:flex;
    justify-content:space-between;
    padding:8px;
    border-left:4px solid #f47a3a; 
    margin-bottom:6px;
    background:#eee7e7;
}

.section-title {
    margin-top:18px;  
    margin-bottom:6px;
    font-weight:bold;
}

/* history */
#history {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 8px;
}

#history div {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #F16D34;
    padding: 7px 11px;
    border-radius: 9px;
    color: white;
}

#history button {
    background: transparent;
    border: none;
    color: white;
    cursor: pointer;
}

/* Forecast */
.forecast {
    display:flex;
    gap: 23px;
    overflow-x:auto;
}

.forecast-card {
    min-width:120px;
    background:#f9efef;
    padding:8px;
    border-radius:8px;
    text-align:center;
}

/* Map */
#map { height:200px; margin-top:9px; border-radius:8px; }

/* Graph */
canvas { margin-top:18px; }

/* Error */
.error {
    color:rgba(255, 0, 0, 0.63);
    background:#f6c1c1;
    padding:7px;
    border-radius:6px;
}

/* Loader */
.loader {
    height:80px;
    background:linear-gradient(90deg,#fac6c6,#ddd,#eee);
    animation:loading 1s infinite;
}
@keyframes loading {
    0% { background-position:-200px; }
    100% { background-position:200px; }
}

/* Dark */
.dark { background:#0f1620; }
.dark .card { background:#161E54; color:#5dcdf9; }

@media(max-width:768px){
    .parent-card { flex-direction:column; }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🌤 My Weather Tracker</h1> 
<button onclick="toggleTheme()">🌙Theme</button>
</div>

<div class="parent-card">

<div class="card">
<h3>Search</h3>

<div class="input-group">
<input id="cityInput" placeholder="Delhi, London">
<button onclick="handleSearch()">Search</button>
</div>

<br>

<h3>History</h3>
<div id="history"></div>
</div>

<div class="card">
<h3>Weather</h3>
<div id="weather"></div>

<div class="section-title">📊 Temperature Trend</div>
<canvas id="chart"></canvas>

<div class="section-title">📅 5-Day Forecast</div>
<div id="forecast" class="forecast"></div>

<div class="section-title">🗺 Location Map</div>
<div id="map"></div>
</div>

</div>
</div>

<script>
const API_KEY = "80bde5a1d4e9c595d089d8e495d440ea";

let chart, map, marker;

//get weather 
async function getWeather(city){
    console.log("Fetching weather for:", city);
    const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`);
    if(!res.ok) throw new Error("City not found");
    return res.json();
}

//get forcast data
async function getForecast(city){
    const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric`);
    return res.json();
}

//updateUI
function showWeatherData(d){
    document.getElementById("weather").innerHTML = `
    <div class="weather-item">🌡 Temp: ${Math.round(d.main.temp)}°C</div>
    <div class="weather-item">🤗 Feels: ${Math.round(d.main.feels_like)}°C</div>
    <div class="weather-item">🌧️ Humidity: ${d.main.humidity}%</div>
    <div class="weather-item">💨 Wind: ${d.wind.speed} m/s</div>
    <div class="weather-item">☀️ Sunrise: ${new Date(d.sys.sunrise*1000).toLocaleTimeString()}</div>
    <div class="weather-item">🌙 Sunset: ${new Date(d.sys.sunset*1000).toLocaleTimeString()}</div>
    `;
}

//temerature chart
function drawChartData(list){
    const data = list.slice(0,6);
    const labels = data.map(i=>i.dt_txt.split(" ")[1]);
    const temps = data.map(i=>Math.round(i.main.temp));

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"),{
        type:"line",
        data:{
            labels,
            datasets:[{
                label:"Temperature (°C)",
                data:temps,
                borderColor:"#F16D34",
                fill:true,
                backgroundColor:"rgba(241,109,52,0.2)"
            }]
        }
    });
}

//display forcast card
function showForecastData(list){
    const container = document.getElementById("forecast");
    container.innerHTML = "";

    list.filter((_,i)=>i%8===0).forEach(item=>{
        container.innerHTML += `
        <div class="forecast-card">
            <div>${new Date(item.dt_txt).toLocaleDateString()}</div>
            <div>${Math.round(item.main.temp)}°C</div>
            <div>${item.weather[0].main}</div>
        </div>
        `;
    });
}

//updated map
function renderMap(lat, lon){
    if(!map){
        map = L.map('map').setView([lat, lon], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    } else {
        map.setView([lat, lon], 10);
    }

    if(marker) marker.remove();
    marker = L.marker([lat, lon]).addTo(map);
}

//save responses
function saveHistory(city){
    let h = JSON.parse(localStorage.getItem("h")||"[]");
    if(!h.includes(city)) h.unshift(city);
    localStorage.setItem("h", JSON.stringify(h.slice(0,10)));
    showHistory();
}

//previous searches
function showHistory(){
    const h = JSON.parse(localStorage.getItem("h")||"[]");
    const box = document.getElementById("history");

    if(!h.length){
        box.innerHTML = "<p>No recent searches</p>";
        return;
    }

    box.innerHTML = "";

    h.forEach(c=>{
        box.innerHTML += `<div>
            <button onclick="search('${c}')">${c}</button>
            <span onclick="deleteCity('${c}')">⤫</span>
        </div>`;
    });
}

//delete city from search
function deleteCity(c){
    let h = JSON.parse(localStorage.getItem("h")||"[]");
    h = h.filter(x=>x!==c);
    localStorage.setItem("h", JSON.stringify(h));
    showHistory();
}

//main search
async function search(city){
    document.getElementById("weather").innerHTML = `<div class="loader"></div>`;
    document.getElementById("forecast").innerHTML = "";
    
    try{
        const w = await getWeather(city);
        const f = await getForecast(city);

        showWeatherData(w);
        drawChartData(f.list);
        showForecastData(f.list);
        renderMap(w.coord.lat, w.coord.lon);
        saveHistory(w.name);

    }catch(e){
        document.getElementById("weather").innerHTML = `<div class="error">City not found</div>`;
    }
}

//handle search
function handleSearch(){
    const c = cityInput.value.trim();

    if(!c){
        alert("Enter a city name");
        return;
    }

    search(c);
}

cityInput.addEventListener("keydown",e=>{
    if(e.key==="Enter") handleSearch();
});

//dark mode
function toggleTheme(){
    document.body.classList.toggle("dark");
}

//init
showHistory();

</script>

</body>
</html>
